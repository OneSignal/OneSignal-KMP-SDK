name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # macOS runner so the Kotlin/Native iOS simulator tests can run.
    runs-on: macos-14
    steps:
      - name: "[Checkout] Repo"
        uses: actions/checkout@v4

      - name: "[Setup] JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "[Setup] Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "[Code Formatting] Spotless"
        run: ./gradlew spotlessCheck --console=plain

      - name: "[Test] Unit tests (JVM/Android + iOS simulator)"
        run: ./gradlew :logger:testDebugUnitTest :logger:iosSimulatorArm64Test --console=plain --continue

      - name: "[Artifacts] Test results"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            logger/build/reports/tests
            logger/build/test-results
