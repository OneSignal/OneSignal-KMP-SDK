name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Verifies the shared :kmp module the same way the Release workflow's gate does:
  # code formatting (Spotless), the full unit-test suite across every target
  # (JVM/Android + the Kotlin/Native iOS simulator), and XCFramework packaging.
  # Named to match `release.yml`'s `verify` job so both surface identically.
  verify:
    name: Spotless + unit tests + XCFramework
    # macOS runner so the Kotlin/Native iOS simulator tests can run.
    runs-on: macos-14
    steps:
      - name: "[Checkout] Repo"
        uses: actions/checkout@v4

      - name: "[Setup] JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: "[Setup] Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "[Code Formatting] Spotless"
        run: ./gradlew spotlessCheck --console=plain

      - name: "[Test] Unit tests (JVM/Android + iOS simulator)"
        run: ./gradlew :kmp:testDebugUnitTest :kmp:iosSimulatorArm64Test --console=plain --continue

      - name: "[Package] XCFramework"
        run: ./gradlew :kmp:verifyOneSignalKMPXCFramework --console=plain

      - name: "[Package] SwiftPM smoke test"
        run: |
          xcodebuild -scheme OneSignalKMP \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: "[Artifacts] Test results"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            kmp/build/reports/tests
            kmp/build/test-results
