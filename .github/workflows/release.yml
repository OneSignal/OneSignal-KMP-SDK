name: Release

# Manual "cut a release" button. Pick a semver bump type and the workflow:
#   1. verifies the code (spotless + JVM/Android + iOS simulator tests + XCFramework),
#   2. computes the next vX.Y.Z from the latest tag (no need to remember the number),
#   3. creates the tag + a GitHub Release with the XCFramework, and
#   4. optionally opens submodule-bump PRs in the Android and iOS SDK repos.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type (applied to the latest tag)"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      open_android_pr:
        description: "Open a submodule-bump PR in OneSignal-Android-SDK"
        type: boolean
        default: true
      open_ios_pr:
        description: "Open a submodule-bump PR in OneSignal-iOS-SDK"
        type: boolean
        default: true

concurrency:
  # Never let two releases run at once.
  group: release
  cancel-in-progress: false

jobs:
  # --- Gate: the exact checks CI runs, so we only ever tag green code. ---
  verify:
    runs-on: macos-14
    steps:
      - name: "[Checkout] Repo"
        uses: actions/checkout@v7

      - name: "[Setup] JDK 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "[Setup] Gradle"
        uses: gradle/actions/setup-gradle@v6

      - name: "[Code Formatting] Spotless"
        run: ./gradlew spotlessCheck --console=plain

      - name: "[Test] Unit tests (JVM/Android + iOS simulator)"
        run: ./gradlew :kmp:testDebugUnitTest :kmp:iosSimulatorArm64Test --console=plain --continue

      - name: "[Package] XCFramework"
        run: |
          ./gradlew :kmp:verifyOneSignalKMPXCFramework --console=plain
          xcodebuild -scheme OneSignalKMP \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios12.0-simulator \
            -F kmp/build/XCFrameworks/release/OneSignalKMP.xcframework/ios-arm64_x86_64-simulator \
            -typecheck - <<'EOF'
          import OneSignalKMP
          let factory: LoggerFactory = LoggerFactory.shared
          EOF
          pod lib lint OneSignalKMP.podspec --allow-warnings --skip-import-validation
          ditto -c -k --sequesterRsrc --keepParent \
            kmp/build/XCFrameworks/release/OneSignalKMP.xcframework \
            OneSignalKMP.xcframework.zip
          swift package compute-checksum OneSignalKMP.xcframework.zip \
            > OneSignalKMP.xcframework.zip.sha256

      - name: "[Artifacts] XCFramework"
        uses: actions/upload-artifact@v7
        with:
          name: onesignal-kmp-xcframework
          path: |
            OneSignalKMP.xcframework.zip
            OneSignalKMP.xcframework.zip.sha256

  # --- Compute version, tag, and publish the GitHub Release. ---
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: "[Checkout] Repo (full history + tags)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "[Version] Resolve release tag"
        id: version
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version=""
          while IFS= read -r tag; do
            version="$tag"
            break
          done < <(git tag --points-at HEAD --list 'v*' --sort=-v:refname)
          if [ -n "$version" ]; then
            echo "Commit $sha is already released as $version; skipping tag and release creation."
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$latest" ]; then
              echo "No existing tags; starting from v0.0.0"
              major=0; minor=0; patch=0
            else
              echo "Latest tag: $latest"
              ver="${latest#v}"
              IFS='.' read -r major minor patch <<< "$ver"
            fi
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            version="v${major}.${minor}.${patch}"
            echo "Next version: $version @ $sha"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: "[Version] Guard against existing tag"
        if: steps.version.outputs.create_release == 'true'
        run: |
          set -euo pipefail
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.version }} already exists."
            exit 1
          fi

      - name: "[Setup] Git user"
        if: steps.version.outputs.create_release == 'true'
        uses: OneSignal/sdk-shared/.github/actions/setup-git-user@main

      - name: "[Tag] Create and push"
        if: steps.version.outputs.create_release == 'true'
        run: |
          set -euo pipefail
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: "[Artifacts] Download XCFramework"
        if: steps.version.outputs.create_release == 'true'
        uses: actions/download-artifact@v8
        with:
          name: onesignal-kmp-xcframework

      - name: "[Release] Create GitHub Release"
        if: steps.version.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            OneSignalKMP.xcframework.zip
            OneSignalKMP.xcframework.zip.sha256

  # --- Open an automated submodule-bump PR in the Android SDK repo. ---
  # Delegates to a reusable workflow that lives IN the Android repo, mirroring the
  # OneSignal/sdk-shared fan-out pattern: the target repo owns the branch/commit/PR
  # logic and authenticates with the shared org push token (GH_PUSH_TOKEN). This
  # avoids a dedicated GitHub App — the default GITHUB_TOKEN cannot write to another
  # repo, but GH_PUSH_TOKEN (already used across the OneSignal SDK repos) can.
  #
  # Requires: the OneSignal-KMP-SDK repo has access to the org `GH_PUSH_TOKEN` secret,
  # and the reusable workflow exists on the Android repo's default branch.
  bump-android:
    needs: release
    if: ${{ inputs.open_android_pr }}
    uses: OneSignal/OneSignal-Android-SDK/.github/workflows/bump-kmp-submodule.yml@main
    secrets:
      GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    with:
      kmp_version: ${{ needs.release.outputs.version }}
      kmp_sha: ${{ needs.release.outputs.sha }}

  # --- Open an automated submodule-bump PR in the iOS SDK repo. ---
  bump-ios:
    needs: release
    if: ${{ inputs.open_ios_pr }}
    uses: OneSignal/OneSignal-iOS-SDK/.github/workflows/bump-kmp-submodule.yml@main
    secrets:
      GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
    with:
      kmp_version: ${{ needs.release.outputs.version }}
      kmp_sha: ${{ needs.release.outputs.sha }}
